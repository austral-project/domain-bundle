# Module of domain-bundle in admin-bundle, added before the configuration of the application
# (AustralDomainExtension::prepend(), only when admin-bundle is enabled). The application changes or disables it in
# config/packages/austral_admin.yaml:
#
#   austral_admin:
#     modules:
#       domain: { enabled: false }
#
# The route and the roles of the 3.1 are kept: ROLE_DOMAIN, ROLE_DOMAIN_EDIT...
austral_admin:
  modules:
    domain:
      name:                       Domain
      picto:                      austral-picto-globe
      pictoTile:                  world
      route:                      domain
      class:                      Austral\DomainBundle\Bridge\Admin\DomainAdmin
      entity_manager:             austral.entity_manager.domain
      translate:                  male_c
      sortable:                   true
      navigation:
        position:                 100
