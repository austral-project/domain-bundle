# Services of the bridge with admin-bundle, loaded only when AustralAdminBundle is enabled (AustralDomainExtension).
services:

  Austral\DomainBundle\Bridge\Admin\DomainAdmin:
    arguments:
      $authorizationChecker:  '@security.authorization_checker'
      $httpConfiguration:     '@austral.http.config'
    tags:
      - { name: austral.admin }

  ##### Variants: a list by domain for the entities filtered by domain
  Austral\DomainBundle\Bridge\Admin\DomainVariantProvider:
    arguments:
      $domainsManagement:     '@Austral\DomainBundle\Services\DomainsManagement'
      $translator:            '@translator'
      $fileLinkGenerator:     '@austral.entity_file.link.generator'
    tags:
      - { name: austral.admin.module_variants, priority: 100 }

  ##### Listeners
  Austral\DomainBundle\Bridge\Admin\AdminDomainListener:
    arguments:
      $domainsManagement:     '@Austral\DomainBundle\Services\DomainsManagement'
    tags:
      # After HttpAdminEventSubscriber::onRequest() (priority 1024), which resolves the module
      - { name: kernel.event_listener, event: austral.event.http.request, method: onRequest, priority: 1023 }

  Austral\DomainBundle\Bridge\Admin\DashboardListener:
    arguments:
      $domainsManagement:     '@Austral\DomainBundle\Services\DomainsManagement'
    tags:
      - { name: kernel.event_listener, event: austral.admin.dashboard, method: dashboard }
