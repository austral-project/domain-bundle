services:

  ##### Listener
  Austral\DomainBundle\Bridge\Admin\Listener\DashboardListener:
    arguments:
      $domainsManagement: '@austral.domain.management'
    tags:
      - { name: kernel.event_listener, event: "austral.event.admin.dashboard", method: dashboard }


parameters:
  austral.admin.class.domain.class:                     Austral\DomainBundle\Bridge\Admin\Admin\DomainAdmin
  austral.admin.modules.domain_bundle.domain.enabled:   true

  austral_admin.modules.domain_bundle:
    domain:
      enabled:                    "%austral.admin.modules.domain_bundle.domain.enabled%"
      navigation:
        position:                 100
      name:                       "Domain"
      picto:                      "austral-picto-globe"
      route:                      "domain"
      class:                      "%austral.admin.class.domain.class%"
      translate:                  "male_c"
      sortable:                   true
      entity_manager:             "austral.entity_manager.domain"
