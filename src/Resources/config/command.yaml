services:

  ##### Command to attach the existing objects to the master domain
  Austral\DomainBundle\Command\DomainAttachementMigrateCommand:
    arguments:
      $entityManager:     '@austral.entity_manager'
      $mapping:           '@austral.entity.mapping'
      $domainsManagement: '@Austral\DomainBundle\Services\DomainsManagement'
    calls:
      - [ setEventDispatcher, [ '@event_dispatcher' ] ]
    tags:
      - { name: console.command, command: 'austral:domain:migrate' }
